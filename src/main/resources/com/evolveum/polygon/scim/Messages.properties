authentication.display=Authentication
authentication.help=Please provide the type of authentication

token.display=Token
token.help=Please provide the token for a token type of authentication

username.display=Username
username.help=Please provide the administrator user name for the scim enabled service you are logging into

password.display=Password
password.help=Please provide the administrator password used to connect to the scim enabled service

clientSecret.display=Clientsecret
clientSecret.help=Please provide the client token generated by the service endpoint for application interconnection

clientId.display=Client ID
clientId.help=Please provide the client token generated by the service endpoint for application interconnection

scim_endpoint.display=Scim endpoint
scim_endpoint.help=Please provide the scim endpoint of the service provider (eg. /services/scim)

scim_version.display=Scim version
scim_version.help=Please provide the scim version which is supported by the service provider (eq. /v1)

loginUrl.display=Login url
loginUrl.help=Please provide the Url address for log in

grant.display=Grant type
grant.help=Please provide the url snippet defining the service and grand type to log into the service (eg. /services/oauth2/token?grant_type=password) or just the string to be part of the requst (e.g. password)

baseUrl.display=Base URL
baseUrl.help=Please provide the base url for a token type of authentication

instanceUrl.display=Instance URL
instanceUrl.help=Instance URL in case it should not be read out from the authentication response. In case you want to ignore it (not set nor read out) simply use "-" (hyphen)

scope.display=Scope
scope.help=Scope for the authentication request. As a side effect without setting of scope the oAuth v1 is expected so the final token is used as "Authorization: oAuth ...". In case the scope is set the oAuth v2 is expected so the final header is "Authorization: Bearer ..."

noPagingEstimation.display=No Paging result estimation
noPagingEstimation.help=Can not estimate remaining paged result.

proxyUrl.display=Proxy address
proxyUrl.help=Please provide the address of the proxy host.

proxyPortNumber.display=Proxy port number
proxyPortNumber.help=Please provide the port number of the proxy host